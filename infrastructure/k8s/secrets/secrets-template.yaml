# IMPORTANT: This is a template file. DO NOT commit actual secrets to version control.
# Use kubectl create secret or a secrets management tool like Google Secret Manager.

# Example command to create secrets:
# kubectl create secret generic backend-core-secrets \
#   --from-literal=DATABASE_PASSWORD='your-db-password' \
#   --from-literal=JWT_SECRET='your-jwt-secret' \
#   --from-literal=RABBITMQ_PASSWORD='your-rabbitmq-password' \
#   --namespace=toeic-system

apiVersion: v1
kind: Secret
metadata:
  name: backend-core-secrets
  namespace: toeic-system
type: Opaque
stringData:
  # Database credentials
  DATABASE_USER: "REPLACE_WITH_ACTUAL_VALUE"
  DATABASE_PASSWORD: "REPLACE_WITH_ACTUAL_VALUE"
  # JWT secret
  JWT_SECRET: "REPLACE_WITH_ACTUAL_VALUE"
  # RabbitMQ credentials
  RABBITMQ_USER: "REPLACE_WITH_ACTUAL_VALUE"
  RABBITMQ_PASSWORD: "REPLACE_WITH_ACTUAL_VALUE"
  # Redis password (if enabled)
  REDIS_PASSWORD: "REPLACE_WITH_ACTUAL_VALUE"
  # GCP Service Account Key (base64 encoded JSON)
  GCP_SERVICE_ACCOUNT_KEY: "REPLACE_WITH_ACTUAL_VALUE"

