apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-ai
  namespace: toeic-system
  labels:
    app: backend-ai
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-ai
  template:
    metadata:
      labels:
        app: backend-ai
        tier: backend
    spec:
      containers:
      - name: backend-ai
        image: gcr.io/PROJECT_ID/backend-ai:latest
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: backend-ai-config
        - secretRef:
            name: backend-ai-secrets
        env:
        - name: DATABASE_URL
          value: "postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
        - name: RABBITMQ_URL
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: model-cache
          mountPath: /root/.cache
      volumes:
      - name: model-cache
        emptyDir:
          sizeLimit: 5Gi

