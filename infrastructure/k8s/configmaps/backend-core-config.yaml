apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-core-config
  namespace: toeic-system
data:
  NODE_ENV: "production"
  PORT: "3000"
  # Database configuration (use secrets for sensitive data)
  DATABASE_HOST: "cloud-sql-proxy-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "toeic_db"
  # Redis configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  # RabbitMQ configuration
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"
  RABBITMQ_QUEUE_GRADING: "exam-grading-queue"
  # CORS configuration
  CORS_ORIGIN: "https://toeic-master-ai.example.com"
  # JWT configuration
  JWT_EXPIRATION: "7d"
  # Storage configuration
  STORAGE_PROVIDER: "gcs"
  GCS_BUCKET_NAME: "toeic-audio-files"

