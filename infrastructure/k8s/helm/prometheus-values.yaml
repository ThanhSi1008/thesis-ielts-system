# Prometheus Helm Chart Values
# Install with: helm install prometheus prometheus-community/kube-prometheus-stack -f prometheus-values.yaml -n toeic-system

# Prometheus configuration
prometheus:
  prometheusSpec:
    # Retention period
    retention: 30d
    retentionSize: "50GB"
    
    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    
    # Resources
    resources:
      requests:
        memory: "2Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "1000m"
    
    # Service monitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    
    # Additional scrape configs
    additionalScrapeConfigs:
      - job_name: 'backend-core'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - toeic-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: backend-core
      
      - job_name: 'backend-ai'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - toeic-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: backend-ai
      
      - job_name: 'traefik'
        static_configs:
          - targets: ['traefik.kube-system.svc.cluster.local:8080']

# Grafana configuration
grafana:
  enabled: true
  adminPassword: "CHANGE_ME_IN_PRODUCTION"
  
  # Persistence
  persistence:
    enabled: true
    size: 10Gi
  
  # Resources
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  
  # Ingress
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.toeic-master-ai.example.com
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.toeic-master-ai.example.com

# Alertmanager configuration
alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# Node exporter
nodeExporter:
  enabled: true

# Kube state metrics
kubeStateMetrics:
  enabled: true

