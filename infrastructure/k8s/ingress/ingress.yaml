apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toeic-ingress
  namespace: toeic-system
  annotations:
    # Traefik annotations
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Enable CORS
    traefik.ingress.kubernetes.io/router.middlewares: toeic-system-cors@kubernetescrd
    # SSL redirect
    traefik.ingress.kubernetes.io/redirect-entry-point: https
    traefik.ingress.kubernetes.io/redirect-permanent: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - api.toeic-master-ai.example.com
    - toeic-master-ai.example.com
    secretName: toeic-tls-cert
  rules:
  # API Backend routing
  - host: api.toeic-master-ai.example.com
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: backend-core-service
            port:
              number: 3000
      - path: /ai
        pathType: Prefix
        backend:
          service:
            name: backend-ai-service
            port:
              number: 8000
  # Frontend routing (if serving from K8s)
  - host: toeic-master-ai.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-web-service
            port:
              number: 3001

---
# CORS Middleware
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: cors
  namespace: toeic-system
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - "*"
    accessControlAllowOriginList:
      - "https://toeic-master-ai.example.com"
      - "http://localhost:3001"
    accessControlMaxAge: 100
    addVaryHeader: true

---
# Rate Limiting Middleware
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: toeic-system
spec:
  rateLimit:
    average: 100
    burst: 50

