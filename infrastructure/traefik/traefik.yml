# Traefik Static Configuration
# This file defines the global configuration for Traefik

global:
  checkNewVersion: true
  sendAnonymousUsage: false

# API and Dashboard
api:
  dashboard: true
  insecure: false  # Dashboard accessible only via authenticated ingress

# Entry Points
entryPoints:
  web:
    address: ":80"
    # Redirect HTTP to HTTPS
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
  
  # Traefik dashboard
  traefik:
    address: ":8080"

# Certificate Resolvers
certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@example.com
      storage: /data/acme.json
      # Use Let's Encrypt staging for testing
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web

# Providers
providers:
  # Kubernetes Ingress provider
  kubernetesIngress:
    allowExternalNameServices: true
    allowEmptyServices: false
    namespaces:
      - toeic-system
  
  # Kubernetes CRD provider (for Middleware, IngressRoute, etc.)
  kubernetesCRD:
    allowExternalNameServices: true
    allowEmptyServices: false
    namespaces:
      - toeic-system
  
  # File provider for additional dynamic configuration
  file:
    filename: /etc/traefik/dynamic-config.yml
    watch: true

# Logging
log:
  level: INFO
  format: json

# Access Logs
accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: keep

# Metrics
metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    entryPoint: traefik

# Tracing (optional - for distributed tracing)
# tracing:
#   jaeger:
#     samplingServerURL: http://jaeger:5778/sampling
#     localAgentHostPort: jaeger:6831

