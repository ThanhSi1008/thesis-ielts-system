version: '3.8'

services:
  # PostgreSQL 16 - Primary relational database
  postgres:
    image: postgres:16-alpine
    container_name: ielts-postgres
    environment:
      POSTGRES_DB: ielts_db
      POSTGRES_USER: ielts_user
      POSTGRES_PASSWORD: ielts_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ielts-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ielts_user -d ielts_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 - In-memory cache and session store
  redis:
    image: redis:7-alpine
    container_name: ielts-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ielts-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ 3 - Message broker for event-driven communication
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ielts-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ielts
      RABBITMQ_DEFAULT_PASS: ielts_password
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ielts-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO - S3-compatible object storage for local development
  minio:
    image: minio/minio:latest
    container_name: ielts-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console UI port
    volumes:
      - minio_data:/data
    networks:
      - ielts-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PgAdmin 4 - PostgreSQL database management tool (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ielts-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ielts.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ielts-network
    restart: unless-stopped
    depends_on:
      - postgres

# Custom bridge network for service communication
networks:
  ielts-network:
    driver: bridge
    name: ielts-network

# Named volumes for data persistence
volumes:
  postgres_data:
    name: ielts_postgres_data
  redis_data:
    name: ielts_redis_data
  rabbitmq_data:
    name: ielts_rabbitmq_data
  minio_data:
    name: ielts_minio_data
  pgadmin_data:
    name: ielts_pgadmin_data

