version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend-core:
        condition: service_healthy
      backend-ai:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  backend-core:
    image: asia-southeast1-docker.pkg.dev/ielts-master-502414/ielts-repo/backend-core:latest
    expose:
      - "3000"
    env_file: .env.backend-core
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  backend-ai:
    image: asia-southeast1-docker.pkg.dev/ielts-master-502414/ielts-repo/backend-ai:latest
    expose:
      - "8000"
    env_file: .env.backend-ai
    volumes:
      - whisper-cache:/root/.cache/huggingface
      - /tmp/audio:/tmp/audio
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')"',
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 10G
          cpus: "3"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    restart: unless-stopped

volumes:
  whisper-cache:
